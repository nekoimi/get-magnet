services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-get_magnet}
      POSTGRES_USER: ${POSTGRES_USER:-get_magnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  get-magnet:
    image: ghcr.io/nekoimi/get-magnet:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8093}:8093"
    environment:
      TZ: Asia/Shanghai
      PORT: 8093
      LOG_ROTATION_MAX_SIZE_MB: ${LOG_ROTATION_MAX_SIZE_MB:-20}
      LOG_ROTATION_MAX_BACKUPS: ${LOG_ROTATION_MAX_BACKUPS:-7}
      LOG_ROTATION_MAX_AGE_DAYS: ${LOG_ROTATION_MAX_AGE_DAYS:-7}
      LOG_ROTATION_COMPRESS: ${LOG_ROTATION_COMPRESS:-true}
      DB_DSN: postgres://${POSTGRES_USER:-get_magnet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-get_magnet}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      QUICK_API_TOKEN: ${QUICK_API_TOKEN:-}
    volumes:
      - app-logs:/workspace/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8093/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  postgres-data:
  app-logs:
