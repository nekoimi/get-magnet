<div class="app"><aside class="sidebar" id="sidebar" aria-label="主导航"><div class="brand"><span class="brand-mark">采</span><span><span class="brand-name">scrapio</span><span class="brand-sub">Data collection · v2.1</span></span></div><button class="project-switch" data-action="project"><span><small>当前项目</small>影视资料库</span><span>⌄</span></button><div class="nav-label">工作区</div><nav class="nav" id="nav"></nav><div class="sidebar-foot"><strong><span class="service-pulse"></span>控制平面运行正常</strong><br>PostgreSQL · scrapio-browser</div></aside><div class="main-shell"><header class="topbar"><button class="menu-btn" data-action="menu" aria-label="打开导航" aria-expanded="false">☰</button><div class="crumb">scrapio / <strong id="crumb">项目</strong></div><div class="top-actions"><span class="demo-pill">示例数据</span><span class="avatar">NK</span></div></header><main class="content" id="view"></main></div></div><div id="overlay"></div><div id="toast-root" role="status" aria-live="polite"></div>
<script>
  const state={page:'project',dataset:'影片资料',datasetQuery:'',datasetStatus:'all',collector:'JavDB 影片详情',collectorTab:'overview',editStep:'fields',run:1,runPage:'detail',panel:null,wizardStep:0,wizard:{name:'',url:'',dataset:'影片资料',template:'detail'},draftSaved:true,activePage:'detail',runInspectTab:'overview',selectedRecord:null};
  const icons={
    project:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zm10 7h6v-9h-6zM4 20h6v-3H4zm10-13h6V4h-6z"/></svg>',
    data:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l8-4 8 4-8 4zM4 7v10l8 4 8-4V7M12 11v10"/></svg>',
    collectors:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16m0-8h6m0 0V7h8m-8 5v5h8"/><circle cx="5" cy="4" r="2"/><circle cx="19" cy="7" r="2"/><circle cx="19" cy="17" r="2"/></svg>',
    runs:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM8 8h8M8 12h5m-5 4h7"/></svg>',
    settings:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/></svg>'
  };
  const nav=[['project','项目'],['data','数据'],['collectors','采集器'],['runs','运行'],['settings','设置']];
  const datasets=[{name:'影片资料',type:'影片',count:'12,480',newCount:38,updated:6,health:'正常',source:'2 个来源'},{name:'磁力资源',type:'磁力',count:'8,216',newCount:21,updated:3,health:'需关注',source:'1 个来源'}];
  const records=[{id:'r1',title:'午夜书店',number:'ABCD-123',actor:'森川晴',source:'JavDB',updated:'今天 09:20',status:'新增',kind:'影片资料'},{id:'r2',title:'海岸来信',number:'EFGH-456',actor:'小泉澄',source:'JavDB',updated:'今天 09:20',status:'更新',kind:'影片资料'},{id:'r3',title:'雨后散步',number:'IJKL-789',actor:'北野遥',source:'备用来源',updated:'昨天 21:10',status:'未变',kind:'影片资料'},{id:'r4',title:'午夜书店 · 4K 磁力',number:'ABCD-123',actor:'magnet:?xt=urn:btih:…',source:'JavDB',updated:'今天 09:20',status:'新增',kind:'磁力资源'}];
  const collectors=[{name:'JavDB 影片详情',site:'javdb.com',dataset:'影片资料',template:'列表到详情',status:'需关注',last:'今天 09:20',version:'v3'},{name:'JavDB 磁力链接',site:'javdb.com',dataset:'磁力资源',template:'单页详情',status:'正常',last:'今天 09:20',version:'v2'},{name:'备用影片来源',site:'example.org',dataset:'影片资料',template:'分页列表',status:'异常',last:'2 天前',version:'v1'}];
  const runs=[{id:1,name:'JavDB 影片详情',status:'部分成功',trigger:'定时',time:'今天 09:00',pages:'31',result:'新增 20 · 更新 3 · 无效 3',version:'v3'},{id:2,name:'JavDB 磁力链接',status:'成功',trigger:'定时',time:'今天 08:30',pages:'12',result:'新增 21 · 未变 30',version:'v2'},{id:3,name:'备用影片来源',status:'失败',trigger:'定时',time:'今天 08:00',pages:'0',result:'获取页面超时',version:'v1'}];
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const status=(t)=>`<span class="status ${t==='正常'||t==='成功'||t==='新增'?'ok':t==='需关注'||t==='部分成功'||t==='更新'?'warn':t==='异常'||t==='失败'?'bad':'neutral'}">${esc(t)}</span>`;
  const btn=(label,action,cls='')=>`<button class="btn ${cls}" data-action="${action}">${label}</button>`;
  const header=(k,title,sub,actions='')=>`<div class="page-header"><div><div class="eyebrow">${k}</div><h1 class="page-title">${title}</h1><p class="sub">${sub}</p></div><div class="actions">${actions}</div></div>`;
  function render(){document.getElementById('nav').innerHTML=nav.map(([key,label])=>`<button class="${state.page===key?'active':''}" data-action="nav:${key}" ${state.page===key?'aria-current="page"':''}><span class="nav-glyph">${icons[key]}</span>${label}</button>`).join('');document.getElementById('crumb').textContent=nav.find(n=>n[0]===state.page)?.[1]||'项目';document.getElementById('view').innerHTML=({project:projectView,data:dataView,collectors:collectorsView,runs:runsView,settings:settingsView})[state.page]();renderOverlay()}
  function projectView(){
    const bars=[[72,8],[64,5],[84,11],[61,13],[92,7],[79,10],[88,6]];
    const trend=bars.map(([ok,fail],i)=>`<div class="run-day"><div class="bar-group"><i class="bar ok" style="height:${ok}%"></i><i class="bar fail" style="height:${fail}%"></i></div><div class="chart-label">${['周五','周六','周日','周一','周二','周三','周四'][i]}</div></div>`).join('');
    const activities=[['JavDB 影片详情完成','新增 20 · 更新 3 · 3 条记录无效','09:20','run:1'],['JavDB 磁力链接完成','新增 21 · 未变 30','08:49','run:2'],['备用影片来源获取失败','目标页面超时 · 已连续失败 3 次','08:00','run:3']];
    return `${header('2026年9月25日 · 周五','影视资料库','持续收集影片资料和磁力资源，优先处理影响数据质量的异常。',btn('＋ 添加来源','wizard','primary'))}
    <div class="grid four">
      <div class="card metric"><div class="metric-top"><span class="label">数据集记录</span><span class="metric-icon">▤</span></div><div class="value">20,696</div><div class="foot">影片资料与磁力资源 · 2 类数据</div></div>
      <div class="card metric"><div class="metric-top"><span class="label">今日新增</span><span class="metric-icon">↗</span></div><div class="value">59</div><div class="foot">另有 <strong>9</strong> 条记录更新</div></div>
      <div class="card metric"><div class="metric-top"><span class="label">可运行来源</span><span class="metric-icon">✓</span></div><div class="value">2 / 3</div><div class="foot">其中 1 个来源质量下降</div></div>
      <div class="card metric urgent"><div class="metric-top"><span class="label">待处理问题</span><span class="metric-icon">!</span></div><div class="value">2</div><div class="foot">字段质量下降 · 来源获取失败</div></div>
    </div>
    <div class="kicker">项目运行</div>
    <div class="overview-grid">
      <section class="card card-pad"><div class="section-head"><div><h2>近 7 日采集运行</h2><div class="muted tiny">正常与异常运行分布 · 最近有效更新 今天 09:20</div></div><a href="#" data-action="nav:runs">查看运行 →</a></div><div class="run-strip" role="img" aria-label="近七日正常与异常运行示意">${trend}</div><div class="legend" style="margin-top:15px"><span><i style="background:#617aca"></i>正常完成</span><span><i style="background:var(--ink)"></i>需关注</span></div></section>
      <section class="card card-pad"><div class="section-head"><div><h2>最近动态</h2><div class="muted tiny">从变化直接进入运行与记录</div></div><span class="status ok">已更新</span></div>${activities.map(([title,detail,time,action])=>`<div class="activity-line row-click" data-action="${action}" role="button" tabindex="0"><span class="activity-dot"></span><span><strong>${title}</strong><small>${detail}</small></span><time>${time}</time></div>`).join('')}</section>
    </div>
    <div class="kicker">优先处理</div><div class="card card-pad"><div class="issue"><div class="issue-mark">!</div><div class="body"><h3>影片标题字段命中率降至 42% ${status('需关注')}</h3><p>JavDB 影片详情 · 影响最近一次运行的 3 条候选记录 · 上次稳定值 98%</p></div>${btn('查看影响','run:1','small')}</div><div class="issue"><div class="issue-mark">!</div><div class="body"><h3>备用影片来源连续 3 次获取失败 ${status('失败')}</h3><p>最后有效更新：2 天前 · 目标站点响应超时</p></div>${btn('查看运行','run:3','small')}</div></div>
    <div class="kicker">数据与来源</div><div class="grid two"><section class="card card-pad"><div class="section-head"><h2>数据集</h2><a href="#" data-action="nav:data">查看全部数据 →</a></div>${datasets.map(d=>`<div class="dataset-row row-click" role="button" tabindex="0" data-action="dataset:${esc(d.name)}"><div class="dataset-icon">${d.type==='影片'?'影':'磁'}</div><div class="row-main"><strong>${d.name}</strong><span class="secondary">${d.source} · 今日新增 ${d.newCount} · 更新 ${d.updated}</span></div><div class="row-end"><div class="primary-number">${d.count}</div><small>${d.type}记录</small></div></div>`).join('')}</section><section class="card card-pad"><div class="section-head"><h2>来源健康</h2><a href="#" data-action="nav:collectors">管理采集器 →</a></div>${collectors.map(c=>`<div class="source-row row-click" role="button" tabindex="0" data-action="collector:${esc(c.name)}"><div class="row-main"><strong>${c.name}</strong><span class="secondary">${c.dataset} · 最近有效运行 ${c.last}</span></div>${status(c.status)}</div>`).join('')}</section></div>
    <div class="kicker">最近变化</div><div class="card card-pad"><div class="section-head"><h2>新收集与更新的记录</h2><a href="#" data-action="dataset:影片资料">浏览记录 →</a></div>${records.slice(0,3).map(r=>`<div class="record-row row-click" role="button" tabindex="0" data-action="record:${r.id}"><div class="dataset-icon" style="width:30px;height:30px;font-size:12px">${r.status==='新增'?'新':'更'}</div><div class="row-main"><strong>${r.title}</strong><span class="secondary">${r.number} · ${r.source} · ${r.updated}</span></div>${status(r.status)}</div>`).join('')}</div>`;
  }
  function dataView(){const selected=datasets.find(d=>d.name===state.dataset)||datasets[0];const filtered=records.filter(r=>r.kind===selected.name&&(!state.datasetQuery||`${r.title} ${r.number} ${r.actor}`.toLowerCase().includes(state.datasetQuery.toLowerCase()))&&(state.datasetStatus==='all'||r.status===state.datasetStatus));return `${header('DATA / DATASETS','数据','查询、筛选与追溯持续采集的记录',`${btn('＋ 添加来源','wizard')} ${btn('＋ 新建数据集','newDataset')}`)}<div class="tabs">${datasets.map(d=>`<button class="tab ${state.dataset===d.name?'active':''}" data-action="dataset:${d.name}">${d.name} <span class="muted">${d.count}</span></button>`).join('')}</div><div class="grid three" style="margin-bottom:18px"><div class="card metric"><div class="label">${selected.name}记录</div><div class="value">${selected.count}</div><div class="foot">${selected.source}</div></div><div class="card metric"><div class="label">今日变化</div><div class="value">${selected.newCount+selected.updated}</div><div class="foot">新增 ${selected.newCount} · 更新 ${selected.updated}</div></div><div class="card metric"><div class="label">数据质量</div><div class="value" style="font-size:21px;margin-top:10px">${selected.health==='正常'?'98.6%':'93.1%'}</div><div class="foot">必填字段有效率 · 最近 7 天</div></div></div><div class="card card-pad"><div class="section-head"><h2>记录</h2><span class="mini-stat">显示最近采集结果 · 示例数据</span></div><div class="toolbar"><input id="record-search" class="input search" placeholder="搜索标题、编号或字段" value="${esc(state.datasetQuery)}"><select id="record-status" class="select"><option value="all">全部变化</option><option value="新增" ${state.datasetStatus==='新增'?'selected':''}>新增</option><option value="更新" ${state.datasetStatus==='更新'?'selected':''}>更新</option><option value="未变" ${state.datasetStatus==='未变'?'selected':''}>未变</option></select><span class="spacer"></span>${btn('导出当前结果','export','small')}</div><div class="table-wrap"><table class="table"><thead><tr><th>记录</th><th>编号</th><th>${selected.name==='影片资料'?'演员 / 关联信息':'磁力链接'}</th><th>来源</th><th>最近发现</th><th>变化</th><th></th></tr></thead><tbody>${filtered.map(r=>`<tr><td class="name">${r.title}</td><td>${r.number}</td><td>${r.actor}</td><td>${r.source}</td><td>${r.updated}</td><td>${status(r.status)}</td><td><button class="btn ghost small" data-action="record:${r.id}">查看 →</button></td></tr>`).join('')}</tbody></table>${filtered.length?'':'<div class="empty"><strong>没有符合条件的记录</strong>调整搜索或变化筛选后再试。</div>'}</div></div>`}
  function collectorsView(){if(state.collectorTab==='editor')return editorView();if(state.collectorTab!=='list')return collectorDetail();return `${header('SOURCES / COLLECTORS','采集器','一个采集器对应一个可发布的来源规则',btn('＋ 添加来源','wizard','primary'))}<div class="card card-pad"><div class="toolbar"><input id="collector-search" class="input search" placeholder="搜索采集器或站点"><span class="spacer"></span><span class="muted tiny">3 个采集器 · 2 个数据集</span></div><div class="table-wrap"><table class="table"><thead><tr><th>采集器</th><th>输出数据集</th><th>模板</th><th>最近有效运行</th><th>状态</th><th>发布版本</th><th></th></tr></thead><tbody>${collectors.map(c=>`<tr class="collector-row"><td class="name">${c.name}<div class="muted tiny">${c.site}</div></td><td>${c.dataset}</td><td>${c.template}</td><td>${c.last}</td><td>${status(c.status)}</td><td>${c.version}</td><td><button class="btn ghost small" data-action="collector:${esc(c.name)}">进入 →</button></td></tr>`).join('')}</tbody></table></div></div>`}
  function collectorDetail(){const c=collectors.find(c=>c.name===state.collector)||collectors[0];return `${header('COLLECTOR / DETAIL',esc(c.name),`${c.site} · ${c.template} · 输出到 ${c.dataset}`,`${status(c.status)} ${btn('配置与预览','edit','primary')}`)}<div class="tabs"><button class="tab active">概览</button><button class="tab" data-action="edit">配置与预览</button><button class="tab" data-action="sample">样例</button><button class="tab" data-action="run:1">运行</button><button class="tab" data-action="versions">版本</button><button class="tab" data-action="schedule">调度</button></div><div class="grid four" style="margin-bottom:18px"><div class="card metric"><div class="label">已发布版本</div><div class="value">${c.version}</div><div class="foot">今天 08:24 发布</div></div><div class="card metric"><div class="label">最近运行</div><div class="value" style="font-size:21px;margin-top:10px">${c.last}</div><div class="foot">${c.status==='需关注'?'部分成功':'成功'}</div></div><div class="card metric"><div class="label">最近新增</div><div class="value">20</div><div class="foot">更新 3 · 未变 2</div></div><div class="card metric"><div class="label">下次运行</div><div class="value" style="font-size:21px;margin-top:10px">明天 09:00</div><div class="foot">Asia/Shanghai · 每天</div></div></div><div class="grid two"><div class="card card-pad"><div class="section-head"><h2>需要关注</h2><a href="#" data-action="run:1">查看运行详情 →</a></div><div class="issue"><div class="issue-mark">!</div><div class="body"><h3>标题字段命中率下降</h3><p>最近一次运行中 3 个详情页的 title 规则未命中。建议用失败页面保存样例后修订。</p></div></div>${btn('从失败页面修复','repair','small warn')}</div><div class="card card-pad"><div class="section-head"><h2>当前配置摘要</h2><a href="#" data-action="edit">编辑规则 →</a></div><dl class="fact-list"><dt>获取方式</dt><dd>浏览器渲染</dd><dt>入口</dt><dd>https://javdb.com/</dd><dt>页面范围</dt><dd>列表 → 详情，最多 40 页</dd><dt>唯一键</dt><dd>number</dd><dt>输出</dt><dd>${c.dataset}</dd></dl></div></div>`}
  function editorView(){const steps=[['target','目标与模板'],['fetch','获取方式'],['discover','发现与分页'],['fields','输出字段'],['dataset','数据集与去重'],['test','测试与发布'],['schedule','调度']];let mid='',preview='';if(state.editStep==='fields'){mid=`<div class="field"><label>字段名称</label><input class="input" value="title"></div><div class="field"><label>提取方式</label><select class="select"><option>CSS 选择器</option><option>XPath</option></select></div><div class="field"><label>选择器</label><input class="input" value="h2.video-title"><div class="field-help">从详情页读取标题文本。修改后需重新预览。</div></div><div class="field"><label>规则</label><div class="choice-grid"><button class="choice active"><strong>必填</strong><small>缺失时记录无效</small></button><button class="choice"><strong>单值</strong><small>取第一个匹配项</small></button></div></div>${btn('预览当前字段','previewField','primary')}`;preview=`<div class="preview-box"><div class="preview-top">保存样例 · /v/ABCD-123 · 详情页</div><div class="preview-body"><strong>页面匹配位置</strong><p class="code-line">&lt;h2 class="video-title"&gt;午夜书店&lt;/h2&gt;</p><div class="field-preview"><span>title · 原始值</span><strong>午夜书店</strong></div><div class="field-preview"><span>转换后</span><strong>午夜书店</strong></div><div class="field-preview"><span>校验</span>${status('成功')}</div></div></div>`}else if(state.editStep==='test'){mid=`<div class="note">完整试运行使用已保存规则，默认不入库、不触发插件。</div><div class="field" style="margin-top:17px"><label>入口 URL</label><input class="input" value="https://javdb.com/"></div><div class="field"><label>最大访问页面数</label><input class="input" type="number" value="5"></div>${btn('开始完整试运行','dryRun','primary')} ${btn('检查发布条件','publishCheck')}`;preview=`<div class="preview-box"><div class="preview-top">最近一次样例回归 · 3 个样例</div><div class="preview-body"><div class="check-row"><span class="check">✓</span>正常详情 · 6/6 字段通过</div><div class="check-row"><span class="check">✓</span>空列表 · 预期无记录</div><div class="check-row"><span class="check">✓</span>字段缺失 · 正确标为无效</div></div></div>`}else{const titles={target:'目标与模板',fetch:'获取方式',discover:'发现与分页',dataset:'数据集与去重',schedule:'调度'};mid=`<div class="note">这里展示 ${titles[state.editStep]} 的配置区。此原型保留页面结构与导航，示例规则已就绪。</div><div class="field" style="margin-top:18px"><label>当前配置</label><div class="code-line">${state.editStep==='fetch'?'浏览器渲染 · 等待元素 .video-title · 超时 15 秒':state.editStep==='discover'?'列表链接 a.video-cover → 详情 · 最多 40 页':state.editStep==='dataset'?'影片资料 · 唯一键 number · 空值不覆盖':state.editStep==='schedule'?'每天 09:00 · Asia/Shanghai':'列表到详情 · javdb.com'}</div></div>${btn('保存草稿','saveDraft','primary')}`;preview=`<div class="preview-box"><div class="preview-top">规则预览 · 已发布版本 v3</div><div class="preview-body"><div class="field-preview"><span>入口</span><strong>https://javdb.com/</strong></div><div class="field-preview"><span>输出数据集</span><strong>影片资料</strong></div><div class="field-preview"><span>预计访问范围</span><strong>最多 40 页 / 60 个任务</strong></div></div></div>`}return `${header('COLLECTOR / EDITOR','配置与预览','JavDB 影片详情 · 草稿 v4 · 上次保存今天 10:35',`${btn('返回概览','collectorBack')} ${btn('保存草稿','saveDraft')} ${btn('发布','publishCheck','primary')}`)}<div class="card workspace"><div class="workspace-nav">${steps.map(([id,label],i)=>`<button class="${state.editStep===id?'active':''}" data-action="step:${id}"><span>${label}</span><span>${i<3?'✓':id==='fields'?'!':'·'}</span></button>`).join('')}</div><div class="workspace-mid"><div class="section-head"><h2>${steps.find(s=>s[0]===state.editStep)[1]}</h2><span class="status ${state.editStep==='fields'?'warn':'ok'}">${state.editStep==='fields'?'待验证':'已配置'}</span></div>${mid}</div><div class="workspace-preview"><div class="section-head"><h2>样例与结果</h2><span class="preview-tag">保存样例</span></div>${preview}</div></div>`}

  function toast(message){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(message)}</div>`;setTimeout(()=>root.innerHTML='',3500)}
  function go(page){document.getElementById('sidebar').classList.remove('open');document.querySelector('.menu-btn').setAttribute('aria-expanded','false');state.page=page;if(page==='collectors')state.collectorTab='list';if(page==='runs')state.runPage='list';render()}
  document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();const a=el.dataset.action;if(a.startsWith('nav:'))return go(a.split(':')[1]);if(a.startsWith('dataset:')){state.dataset=a.slice(8);state.page='data';state.datasetQuery='';return render()}if(a.startsWith('collector:')){state.collector=a.slice(10);state.page='collectors';state.collectorTab='overview';return render()}if(a.startsWith('run:')){state.run=Number(a.slice(4));state.page='runs';state.runPage='detail';state.activePage=state.run===3?'entry':'detail';state.runInspectTab='overview';state.panel=null;return render()}if(a.startsWith('record:')){state.selectedRecord=a.slice(7);state.panel='record';return renderOverlay()}if(a.startsWith('step:')){state.editStep=a.slice(5);return render()}if(a.startsWith('page:')){state.activePage=a.slice(5);state.runInspectTab='overview';return render()}if(a.startsWith('inspect:')){state.runInspectTab=a.slice(8);return render()}if(a.startsWith('template:')){state.wizard.template=a.slice(9);return renderOverlay()}switch(a){case 'menu':{const side=document.getElementById('sidebar');const open=side.classList.toggle('open');document.querySelector('.menu-btn').setAttribute('aria-expanded',String(open));break}case 'project':go('project');break;case 'wizard':state.wizard.dataset=state.page==='data'?state.dataset:'影片资料';state.panel='wizard';state.wizardStep=0;renderOverlay();break;case 'wizardNext':{const name=document.getElementById('wizard-name'),url=document.getElementById('wizard-url'),dataset=document.getElementById('wizard-dataset');if(name)state.wizard.name=name.value;if(url)state.wizard.url=url.value;if(dataset)state.wizard.dataset=dataset.value;if(state.wizardStep===1&&(!state.wizard.name.trim()||!/^https?:\/\//.test(state.wizard.url.trim())))return toast('请填写名称和以 http(s) 开头的 URL');state.wizardStep=Math.min(4,state.wizardStep+1);renderOverlay();break}case 'wizardPrev':state.wizardStep=Math.max(0,state.wizardStep-1);renderOverlay();break;case 'wizardPublish':{const name=state.wizard.name.trim()||'新采集器';collectors.unshift({name,site:state.wizard.url.replace(/^https?:\/\//,'').split('/')[0]||'新站点',dataset:state.wizard.dataset,template:{detail:'单页详情',list:'列表到详情',pages:'分页列表',json:'JSON 接口'}[state.wizard.template],status:'正常',last:'刚刚',version:'v1'});state.panel=null;state.collector=name;state.page='collectors';state.collectorTab='overview';toast('示例采集器已创建并发布');render();break}case 'closePanel':state.panel=null;renderOverlay();break;case 'edit':state.page='collectors';state.collectorTab='editor';render();break;case 'collectorBack':state.collectorTab='overview';render();break;case 'runsList':state.runPage='list';render();break;case 'repair':state.panel=null;state.page='collectors';state.collector=state.run===3?'备用影片来源':'JavDB 影片详情';state.collectorTab='editor';state.editStep=state.run===3?'fetch':'fields';render();toast(state.run===3?'已从失败运行进入获取方式设置':'已从失败页面进入标题字段规则');break;case 'saveDraft':toast('草稿已保存（原型示例）');break;case 'previewField':toast('字段预览已刷新：命中 1 个标题');break;case 'dryRun':toast('完整试运行完成：访问 1 页，预计新增 1 条');break;case 'publishCheck':state.panel='publish';renderOverlay();break;case 'confirmPublish':state.panel=null;renderOverlay();toast('示例版本已发布');break;case 'saveSample':toast('失败页面已保存为样例');break;case 'rerun':toast('已创建示例重跑：使用原发布版本');break;case 'export':toast('已准备当前筛选结果的 CSV 导出（原型示例）');break;case 'sample':case 'versions':case 'schedule':state.panel=a;renderOverlay();break;case 'manualRun':state.panel='manual';renderOverlay();break;case 'createRun':state.panel=null;state.page='runs';state.run=1;state.runPage='detail';render();toast('已创建示例运行');break;case 'newDataset':state.panel='newDataset';renderOverlay();break;case 'createDataset':{let v=document.getElementById('new-dataset-name').value.trim();if(!v)return toast('请填写数据集名称');if(datasets.some(d=>d.name===v))return toast('数据集名称已存在');datasets.push({name:v,type:v,count:'0',newCount:0,updated:0,health:'正常',source:'0 个来源'});state.dataset=v;state.panel=null;state.page='data';render();toast('示例数据集已创建');break}}});
  document.addEventListener('input',e=>{if(e.target.id==='wizard-name')state.wizard.name=e.target.value;if(e.target.id==='wizard-url')state.wizard.url=e.target.value;if(e.target.id==='record-search'){state.datasetQuery=e.target.value;const pos=e.target.selectionStart;render();const next=document.getElementById('record-search');next.focus();next.setSelectionRange(pos,pos)}if(e.target.id==='collector-search'){const term=e.target.value.toLowerCase();document.querySelectorAll('.collector-row').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(term))}});
  document.addEventListener('change',e=>{if(e.target.id==='record-status'){state.datasetStatus=e.target.value;render()}if(e.target.id==='run-filter'){const v=e.target.value;document.querySelectorAll('#view tbody tr').forEach(row=>row.hidden=v==='需要处理'?!/部分成功|失败/.test(row.textContent):v==='成功'?!/成功/.test(row.textContent):false)}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.panel){state.panel=null;renderOverlay()}else{document.getElementById('sidebar').classList.remove('open');document.querySelector('.menu-btn').setAttribute('aria-expanded','false')}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-action]')){e.preventDefault();e.target.click()}});
  render();
</script>
</body>
