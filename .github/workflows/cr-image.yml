name: Build application image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - feature/**
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test backend and build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and UI submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare submodules
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          test -f ui/get-magnet-ui/package.json
          test -f ui/get-magnet-ui/pnpm-lock.yaml
          test -f ui/aria-ng/package.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test -timeout 60s ./...

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/get-magnet-ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ui/get-magnet-ui
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ui/get-magnet-ui
        env:
          VITE_PUBLIC_PATH: /
          VITE_API_URL: /
        run: pnpm build

      - name: Build AriaNg
        working-directory: ui/aria-ng
        run: |
          npm ci
          npm run build
          test -f dist/index.html

  image:
    name: Build and publish application image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository and UI submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare Docker build context
        id: build-context
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive
          test -f ui/get-magnet-ui/package.json
          test -f ui/get-magnet-ui/pnpm-lock.yaml
          test -f ui/aria-ng/package.json

          build_context="${RUNNER_TEMP}/get-magnet-context-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${build_context}"
          git archive --format=tar HEAD | tar -xf - -C "${build_context}"
          mkdir -p "${build_context}/ui/get-magnet-ui" "${build_context}/ui/aria-ng"
          cp -a ui/get-magnet-ui/. "${build_context}/ui/get-magnet-ui/"
          cp -a ui/aria-ng/. "${build_context}/ui/aria-ng/"

          test -f "${build_context}/ui/get-magnet-ui/pnpm-lock.yaml"
          test -f "${build_context}/ui/aria-ng/package.json"
          echo "path=${build_context}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and publish combined backend and UI image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.build-context.outputs.path }}
          file: ${{ steps.build-context.outputs.path }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            VITE_PUBLIC_PATH=/
            VITE_API_URL=/
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
